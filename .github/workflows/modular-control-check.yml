name: Modular control checks
on:
  pull_request:
  push:
    branches: [feature/modular-project-control]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_fixture_only
          POSTGRES_DB: role_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d role_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/controlMetrics.test.js
      - run: npm run lint
      - run: npm run build
      - name: Check isolated role policies
        env:
          PGPASSWORD: local_fixture_only
        run: |
          psql -h localhost -U postgres -d role_fixture -v ON_ERROR_STOP=1 -f tests/db/legacy-fixture.sql
          psql -h localhost -U postgres -d role_fixture -v ON_ERROR_STOP=1 -f supabase/modular_project_control.sql
          psql -h localhost -U postgres -d role_fixture -v ON_ERROR_STOP=1 -f tests/db/project-roles.sql
