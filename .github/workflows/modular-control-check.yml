name: Modular control checks
on:
  pull_request:
  push:
    branches: [feature/modular-project-control]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/controlMetrics.test.js
      - run: npm run lint
      - run: npm run build
